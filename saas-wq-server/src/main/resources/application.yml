server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: saas-wq-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:saas_wq}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:saas}
    password: ${DB_PASSWORD:saas123}
    hikari:
      pool-name: SaasWqHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

wq:
  security:
    jwt:
      # Override in production through the JWT_SECRET environment variable.
      secret: ${JWT_SECRET:saas-wq-local-development-secret-key-change-me}
      expiration: ${JWT_EXPIRATION:PT12H}
      issuer: saas-wq
  rate-limit:
    # Tenant based fixed window quota enforced on every /api/** request.
    # When disabled, or when Redis is unreachable, requests are allowed through.
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:saas-wq:rate-limit:}
  stripe:
    # Leave the keys empty to start the service without a payment provider.
    # Checkout returns 503 and webhooks are rejected until they are configured.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: "${STRIPE_SUCCESS_URL:http://localhost:5173/billing/success?session_id={CHECKOUT_SESSION_ID}}"
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/billing/cancel}
    currency: ${STRIPE_CURRENCY:usd}
    plans:
      STARTER:
        name: Starter
        amount-cents: 2900
        interval: month
      PROFESSIONAL:
        name: Professional
        amount-cents: 9900
        interval: month
      ENTERPRISE:
        name: Enterprise
        amount-cents: 29900
        interval: month

logging:
  level:
    com.wq: info
    org.springframework.security: warn

management:
  endpoints:
    web:
      exposure:
        # Metrics and health are consumed by the monitoring stack; restrict them at the
        # network level before exposing the service to the internet.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
